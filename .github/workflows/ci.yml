name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: make lint
      # Coverage measures through sys.monitoring where Python has it (3.12 and later): the default tracer slows every
      # line enough that the Arcade step's timing test fails. 3.11 has no sys.monitoring and keeps the default.
      - run: python -m pytest --cov=terminal_invaders --cov-report=term-missing --cov-report=json --cov-fail-under=90
        env:
          COVERAGE_CORE: ${{ matrix.python != '3.11' && 'sysmon' || '' }}
      # Spec 11.6 and Phase 4 §23: each term/ and campaign/ module at least 90% on its own, which the package-wide
      # 90% does not check; and Phase 5's new modules (G5.3).
      - run: python tools/term_coverage.py coverage.json --also fx settings tapes screens tutorial attract --min 90
      - run: invaders --version
  # Phase 5 G5.6, G5.7 and G5.4: the palettes' contrast, shape and flash gates (about 20 s), and the goldens are
  # what tests/support/frames.py draws (make frames leaves nothing to write).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - run: make palette-check
      - run: python tools/make_frames.py --check
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # A fresh venv outside the checkout proves the wheel works without the source tree.
      - run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
      - run: |
          "$RUNNER_TEMP/wheel-venv/bin/invaders" --version
          "$RUNNER_TEMP/wheel-venv/bin/invaders" --verify-replay tests/fixtures/golden-classic-normal.json
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c "from terminal_invaders.audio import helper, mixer"
