[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-invaders"
version = "1.0.0"
description = "A deterministic, dependency-free terminal arcade game for macOS and Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
invaders = "terminal_invaders.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["terminal_invaders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["terminal_invaders"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
