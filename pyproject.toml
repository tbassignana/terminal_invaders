[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-invaders"
dynamic = ["version"]
description = "A deterministic, dependency-free terminal arcade game for macOS and Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["space invaders", "arcade", "game", "terminal", "retro"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Games/Entertainment :: Arcade",
]

[project.urls]
Homepage = "https://github.com/tbassignana/terminal_invaders"
Repository = "https://github.com/tbassignana/terminal_invaders"

[project.scripts]
invaders = "terminal_invaders.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
dev = ["terminal-invaders[test]", "build>=1"]

[tool.setuptools.dynamic]
version = {attr = "terminal_invaders.__version__"}

[tool.setuptools.packages.find]
include = ["terminal_invaders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["terminal_invaders"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
